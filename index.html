<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Creepydex</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { blood: '#8a0303', sickly: '#bada55', void: '#0a0a0a' }
                } 
            }
        }
    </script>
    <style>
        .touch-manipulation {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #modal-content {
            -webkit-overflow-scrolling: touch;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #8a0303; border-radius: 10px; }
    </style>
</head>
<body class="bg-void text-gray-300 font-sans antialiased min-h-screen flex flex-col relative">

    <header class="bg-gray-900 border-b border-blood p-4 sticky top-0 z-20 shadow-[0_4px_20px_rgba(138,3,3,0.5)]">
        <div class="max-w-7xl mx-auto flex flex-col gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-blood text-center uppercase tracking-widest drop-shadow-md">Creepydex</h1>
                <p class="text-center text-xs text-gray-500 mt-1 font-mono uppercase tracking-wider italic">Global Paranormal Archive</p>
            </div>
            
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="search-input" placeholder="Search name, origin, or category..." class="flex-grow bg-black border border-gray-700 text-gray-200 rounded-lg p-3 text-base focus:outline-none focus:border-blood focus:ring-1 focus:ring-blood transition-colors shadow-inner font-mono placeholder-gray-600">
                
                <div class="flex gap-2">
                    <select id="location-select" class="bg-black border border-gray-700 text-gray-400 rounded-lg p-3 focus:outline-none focus:border-blood font-mono cursor-pointer outline-none min-w-[140px]">
                        <option value="all">Global (All)</option>
                    </select>

                    <select id="sort-select" class="bg-black border border-gray-700 text-gray-400 rounded-lg p-3 focus:outline-none focus:border-blood font-mono cursor-pointer outline-none">
                        <option value="id">Sort by: ID</option>
                        <option value="name">Name (A-Z)</option>
                        <option value="category">Category</option>
                        <option value="danger_desc">Danger (High)</option>
                        <option value="danger_asc">Danger (Low)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full">
        <div id="monster-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <div id="monster-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-gray-900 border-2 border-blood rounded-xl shadow-[0_0_30px_rgba(138,3,3,0.6)] w-full max-w-lg relative overflow-hidden flex flex-col max-h-[90vh]">
            <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-blood transition-colors z-10 bg-black/50 rounded-full p-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div class="overflow-y-auto" id="modal-content"></div>
        </div>
    </div>

    <script src="data.js"></script>

    <script>
        const listContainer = document.getElementById('monster-list');
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const locationSelect = document.getElementById('location-select');
        const modal = document.getElementById('monster-modal');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal');
        
        const fallbackImage = "https://placehold.co/600x400/111111/555555?text=NO+IMAGE+ON+FILE";

        function populateLocations() {
            const locations = new Set();
            cryptids.forEach(m => {
                const parts = m.origin.split(',');
                const region = parts[parts.length - 1].trim();
                locations.add(region);
            });

            const sortedLocations = Array.from(locations).sort();
            sortedLocations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.innerText = loc;
                locationSelect.appendChild(opt);
            });
        }

        function getDangerUI(level) {
            if (level <= 3) return 'border-green-900 shadow-[0_0_10px_rgba(34,197,94,0.1)]';
            if (level <= 7) return 'border-orange-900 shadow-[0_0_10px_rgba(249,115,22,0.1)]';
            return 'border-blood shadow-[0_0_15px_rgba(138,3,3,0.4)]';
        }

        function openModal(monster) {
            const imgPath = `./${monster.image}`;
            modalContent.innerHTML = `
                <div class="relative">
                    <img src="${imgPath}" onerror="this.src='${fallbackImage}'" class="w-full h-64 object-cover border-b-2 border-blood" alt="${monster.name}">
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent opacity-60"></div>
                </div>
                <div class="p-6">
                    <h2 class="text-4xl font-black text-sickly drop-shadow-md mb-2">${monster.name}</h2>
                    <div class="mb-4 text-sm text-gray-400 font-bold uppercase tracking-widest border-b border-gray-800 pb-4">${monster.category} • ${monster.origin}</div>
                    <div class="mb-6 flex items-center gap-3 bg-black/50 p-3 rounded border border-gray-800">
                        <span class="text-blood font-black text-lg uppercase tracking-wider">Danger Level:</span> 
                        <span class="text-white text-xl font-mono">${monster.danger_level} / 10</span>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <h3 class="text-blood font-bold uppercase tracking-wider mb-2 text-sm">Target Description</h3>
                            <p class="text-gray-300 leading-relaxed">${monster.description}</p>
                        </div>
                        <div>
                            <h3 class="text-blood font-bold uppercase tracking-wider mb-2 text-sm">Known Lore / Behavior</h3>
                            <p class="text-gray-300 leading-relaxed italic border-l-2 border-gray-700 pl-4">${monster.lore}</p>
                        </div>
                    </div>
                    <div class="mt-8 bg-black/80 p-4 rounded-lg border-l-4 border-sickly shadow-inner">
                        <span class="font-black text-sickly block mb-2 uppercase tracking-widest text-lg">EXPLOITABLE WEAKNESS:</span> 
                        <span class="text-gray-200 text-lg">${monster.weakness}</span>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        function renderMonsters(monstersToRender) {
            listContainer.innerHTML = ''; 
            monstersToRender.forEach(monster => {
                const card = document.createElement('div');
                const dangerUI = getDangerUI(monster.danger_level);
                
                card.className = `bg-gray-900 border-2 rounded-xl transition-all duration-300 flex flex-col h-full cursor-pointer overflow-hidden touch-manipulation hover:scale-[1.02] ${dangerUI}`;
                card.addEventListener('click', () => openModal(monster));
                
                card.innerHTML = `
                    <img src="./${monster.image}" onerror="this.src='${fallbackImage}'" class="w-full h-48 object-cover border-b border-gray-800">
                    <div class="p-5 flex flex-col flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <h2 class="text-2xl font-bold text-sickly drop-shadow-md">${monster.name}</h2>
                            <span class="text-xs bg-black px-2 py-1 rounded border border-gray-700 text-gray-500 font-mono">#${monster.id}</span>
                        </div>
                        <div class="mb-4 text-xs text-gray-400 font-bold uppercase tracking-widest border-b border-gray-800 pb-2">${monster.category}</div>
                        <div class="flex-grow">
                            <p class="text-sm mb-4 text-gray-300 leading-relaxed line-clamp-3">${monster.description}</p>
                        </div>
                        <div class="mt-auto pt-4 border-t border-gray-800 flex justify-between items-center font-mono">
                            <span class="text-[10px] text-gray-500 uppercase truncate pr-2">${monster.origin}</span>
                            <span class="${monster.danger_level >= 8 ? 'text-blood font-black' : 'text-gray-400'} text-sm whitespace-nowrap">DL: ${monster.danger_level}</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function updateDisplay() {
            const searchString = searchInput.value.toLowerCase();
            const sortMethod = sortSelect.value;
            const selectedLoc = locationSelect.value;

            let filtered = cryptids.filter(monster => {
                const matchesSearch = (
                    monster.name.toLowerCase().includes(searchString) ||
                    monster.origin.toLowerCase().includes(searchString) ||
                    monster.category.toLowerCase().includes(searchString)
                );
                
                const matchesLocation = selectedLoc === 'all' || monster.origin.includes(selectedLoc);
                return matchesSearch && matchesLocation;
            });

            filtered.sort((a, b) => {
                switch(sortMethod) {
                    case 'name': return a.name.localeCompare(b.name);
                    case 'category': return a.category.localeCompare(b.category);
                    case 'danger_desc': return b.danger_level - a.danger_level;
                    case 'danger_asc': return a.danger_level - b.danger_level;
                    case 'id': return parseInt(a.id) - parseInt(b.id);
                    default: return 0;
                }
            });

            renderMonsters(filtered);
        }

        populateLocations();
        searchInput.addEventListener('keyup', updateDisplay);
        sortSelect.addEventListener('change', updateDisplay);
        locationSelect.addEventListener('change', updateDisplay);

        updateDisplay();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
